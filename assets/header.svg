<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a29bfe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#darkGradient)"/>
  
  <!-- Logo placeholder circle (represents the 刀 tentacle logo) -->
  <circle cx="300" cy="200" r="120" fill="none" stroke="#2d3436" stroke-width="2"/>
  <circle cx="300" cy="200" r="100" fill="#0a0a0a" opacity="0.8"/>
  
  <!-- Stylized tentacle-like elements -->
  <path d="M 300 100 Q 280 140 290 180 Q 295 200 300 200" 
        stroke="#e74c3c" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 300 100 Q 320 140 310 180 Q 305 200 300 200" 
        stroke="#e74c3c" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 280 120 Q 260 150 270 190 Q 280 205 300 200" 
        stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 320 120 Q 340 150 330 190 Q 320 205 300 200" 
        stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Eyes on tentacles -->
  <circle cx="290" cy="150" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="290" cy="150" r="3" fill="#1a1a2e"/>
  <circle cx="310" cy="150" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="310" cy="150" r="3" fill="#1a1a2e"/>
  <circle cx="275" cy="170" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="275" cy="170" r="2.5" fill="#1a1a2e"/>
  <circle cx="325" cy="170" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="325" cy="170" r="2.5" fill="#1a1a2e"/>
  
  <!-- Abyssland Text -->
  <text x="480" y="220" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="url(#textGradient)">Abyssland</text>
  
  <!-- Subtitle -->
  <text x="482" y="260" font-family="Arial, sans-serif" font-size="24" fill="#7f8c8d" opacity="0.8">Wayland Compositor</text>
</svg>
